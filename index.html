<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voor Kailani ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root{
    --bg:#0a0710; --bg2:#0f0a14;
    --pink:#ff5c9a; --pink2:#ffb1cc; --pink3:#ff8fb4;
    --white:#fff8fb; --muted:#b9aab2;
    --gold:#ffcd85; --gold2:#ffe0b3; --gold-line:rgba(255,205,133,.2);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    min-height:100vh;
    background: var(--bg);
    color: var(--white);
    font-family: Poppins, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed; inset:0; pointer-events:none; z-index:-2;
    background:
      radial-gradient(circle at 50% 0%, rgba(255,61,137,.16), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(255,61,137,.10), transparent 35%),
      radial-gradient(circle at 8% 80%, rgba(198,92,255,.08), transparent 35%);
  }

  .blob{position:fixed; border-radius:50%; filter:blur(80px); opacity:.3; mix-blend-mode:screen; z-index:-1; pointer-events:none;}
  .b1{width:44vw; height:44vw; left:-14vw; top:-12vw; background:radial-gradient(circle,#ff5c9a,transparent 70%); animation:driftA 26s ease-in-out infinite alternate;}
  .b2{width:36vw; height:36vw; right:-10vw; bottom:-14vw; background:radial-gradient(circle,#ffcd85,transparent 70%); animation:driftB 30s ease-in-out infinite alternate;}
  @keyframes driftA{from{transform:translate(0,0) scale(1)} to{transform:translate(6vw,8vh) scale(1.1)}}
  @keyframes driftB{from{transform:translate(0,0) scale(1)} to{transform:translate(-8vw,-6vh) scale(.94)}}
  @media (prefers-reduced-motion: reduce){ .blob{ animation:none; } }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:440px;
    margin: 40px 20px;
    text-align:center;
    background: rgba(9,6,14,.55);
    backdrop-filter: blur(22px) saturate(1.3);
    -webkit-backdrop-filter: blur(22px) saturate(1.3);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 26px;
    padding: clamp(36px,7vw,56px) clamp(26px,6vw,44px);
  }

  .glow-heart{
    font-size:44px;
    color: var(--pink);
    text-shadow: 0 0 40px rgba(255,92,154,.65);
    animation: pulse 2.4s ease-in-out infinite;
    margin-bottom: 18px;
  }
  @keyframes pulse{0%,100%{transform:scale(1); opacity:.85;} 50%{transform:scale(1.12); opacity:1;}}

  .eyebrow{
    text-transform:uppercase;
    letter-spacing:4px;
    color: var(--pink2);
    font-size:11px;
    font-weight:600;
    margin-bottom:16px;
  }

  h1{
    font-family:"Cormorant Garamond", serif;
    font-weight:500;
    font-size: clamp(38px,7vw,54px);
    line-height:1.05;
    letter-spacing:-1px;
    margin-bottom:18px;
  }
  h1 em{ color: var(--pink); font-style:italic; }

  p.sub{
    color: var(--muted);
    font-size:14.5px;
    line-height:1.85;
    max-width:340px;
    margin: 0 auto 34px;
  }

  /* ---------- player ---------- */
  .player{
    display:flex;
    align-items:center;
    gap:16px;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.03);
    border-radius: 18px;
    padding: 16px 18px;
    margin-bottom: 22px;
  }
  .play-btn{
    flex:none;
    width:52px;
    height:52px;
    border-radius:50%;
    border:none;
    background: radial-gradient(circle at 35% 30%, var(--pink3), var(--pink) 70%);
    color:#160910;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow: 0 0 24px rgba(255,92,154,.55);
    transition: transform .2s ease;
  }
  .play-btn:hover{ transform: scale(1.06); }
  .play-btn:active{ transform: scale(.95); }
  .play-btn svg{ width:19px; height:19px; }
  .play-btn .pause-icon{ display:none; }
  .play-btn.playing .play-icon{ display:none; }
  .play-btn.playing .pause-icon{ display:block; }

  .bars{
    flex:1;
    display:flex;
    align-items:flex-end;
    gap:3px;
    height:34px;
    cursor:pointer;
  }
  .bars span{
    flex:1;
    background: rgba(255,177,204,.28);
    border-radius:3px;
    min-height:4px;
    transition: background .2s ease;
  }
  .bars span.active{ background: var(--pink); box-shadow:0 0 6px rgba(255,92,154,.6); }

  .time-row{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color: var(--muted);
    margin: -10px 0 24px;
    font-variant-numeric: tabular-nums;
  }

  .actions{
    display:flex;
    justify-content:center;
  }

  .download-btn{
    display:inline-flex;
    align-items:center;
    gap:14px;
    border: 1px solid rgba(255,154,192,.4);
    background: rgba(255,92,154,.08);
    color: var(--white);
    padding: 17px 30px;
    border-radius: 100px;
    text-decoration:none;
    font-size:13px;
    letter-spacing:1px;
    font-weight:500;
    transition: .3s;
    cursor:pointer;
  }
  .download-btn:hover{
    background: var(--pink);
    transform: translateY(-3px);
    box-shadow: 0 12px 35px rgba(255,70,140,.28);
  }
  .download-btn svg{ width:17px; height:17px; flex:none; }

  .signature{
    margin-top:30px;
    font-family:"Cormorant Garamond", serif;
    font-style:italic;
    color: var(--pink3);
    font-size:15px;
  }
</style>
</head>
<body>

<span class="blob b1" aria-hidden="true"></span>
<span class="blob b2" aria-hidden="true"></span>

<div class="card">
  <div class="glow-heart">♥</div>
  <p class="eyebrow">speciaal voor jou</p>
  <h1>Voor jou,<br><em>Kailani.</em></h1>
  <p class="sub">Een klein stukje geluid, alleen voor jou. Luister het hier af, of download het voor later.</p>

  <div class="player">
    <button class="play-btn" id="playBtn" aria-label="Afspelen">
      <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <div class="bars" id="bars"></div>
  </div>
  <div class="time-row">
    <span id="curTime">0:00</span>
    <span id="durTime">0:00</span>
  </div>

  <audio id="audio" src="kailani-audio.mp3" preload="metadata"></audio>

  <div class="actions">
    <a class="download-btn" href="kailani-audio.mp3" download="voor-kailani.mp3">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 20h14v-2H5v2zM12 2v12.17l3.59-3.58L17 12l-5 5-5-5 1.41-1.41L12 14.17V2h0z"/></svg>
      Download audio
    </a>
  </div>

  <p class="signature">Van Jarno, met heel veel liefde ❤️</p>
</div>

<script>
  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const barsEl = document.getElementById('bars');
  const curTime = document.getElementById('curTime');
  const durTime = document.getElementById('durTime');

  const BAR_COUNT = 36;
  for (let i = 0; i < BAR_COUNT; i++) {
    const h = 6 + Math.round(Math.abs(Math.sin(i * 0.7)) * 22 + Math.random() * 6);
    const span = document.createElement('span');
    span.style.height = h + 'px';
    barsEl.appendChild(span);
  }
  const barEls = Array.from(barsEl.children);

  function fmt(t){
    if (!isFinite(t)) return '0:00';
    const m = Math.floor(t / 60);
    const s = Math.floor(t % 60).toString().padStart(2, '0');
    return m + ':' + s;
  }

  audio.addEventListener('loadedmetadata', () => {
    durTime.textContent = fmt(audio.duration);
  });

  playBtn.addEventListener('click', () => {
    if (audio.paused) { audio.play(); } else { audio.pause(); }
  });

  audio.addEventListener('play', () => playBtn.classList.add('playing'));
  audio.addEventListener('pause', () => playBtn.classList.remove('playing'));
  audio.addEventListener('ended', () => playBtn.classList.remove('playing'));

  audio.addEventListener('timeupdate', () => {
    curTime.textContent = fmt(audio.currentTime);
    const progress = audio.duration ? audio.currentTime / audio.duration : 0;
    const activeCount = Math.floor(progress * BAR_COUNT);
    barEls.forEach((b, i) => b.classList.toggle('active', i < activeCount));
  });

  function seekFromEvent(e){
    const rect = barsEl.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const ratio = Math.min(Math.max((clientX - rect.left) / rect.width, 0), 1);
    if (audio.duration) { audio.currentTime = ratio * audio.duration; }
  }
  barsEl.addEventListener('click', seekFromEvent);
</script>

</body>
</html>
